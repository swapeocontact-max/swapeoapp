guest:function(){SB.auth.signInAnonymously().then(function(r){if(r.error)return bad(r.error.message);load()})},
guestUp:function(){SB.auth.signOut().then(function(){S.mode='up';S.st=0;S.reg='fan';R()})},
otp:function(){if(S.mode=='phone'){if(S.st==0){var ph=normPhone(S.f_ph);SB.auth.signInWithOtp({phone:ph}).then(function(r){if(r.error)return bad(r.error.message);S.f_ph=ph;S.st=1;R();toast('Code sent')})}else{SB.auth.verifyOtp({phone:S.f_ph,token:S.f_ot,type:'sms'}).then(function(r){if(r.error)return bad(r.error.message);S.mode='in';S.st=0;load()})}}else{SB.auth.signInWithOtp({email:S.f_em,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){if(r.error)return bad(r.error.message);S.st=1;R()})}},
finishOb:function(){run(async function(){var a=await SB.from('profiles').update({username:S.f_un}).eq('id',S.me.id);if(a.error)return a;if(S.f_rf){var b=await SB.rpc('apply_referral',{p_code:S.f_rf});if(b.error)bad(b.error.message)}if(S.reg=='creator'){var c=await SB.rpc('become_creator',{p_name:S.f_cn,p_category:S.f_cc,p_price:Math.round(+S.f_cp),p_niche:S.f_ni});if(c.error)return c}},'Welcome to Swapeo').then(function(ok){if(ok){S.mode='in';S.st=0}else{S.st=0;R()}})},
amToggle:function(v){var val=S.am[v]?0:1;run(function(){return SB.from('settings').upsert({key:'auth_'+v,value:val})},val?'Method turned on':'Method turned off')},

occ:function(v){S.occ=v;var n=(S.rc||'').trim()||'[name]';S.note=TPL[v]?TPL[v].replace('[name]',n):'';saveDraft();R()},
rate:function(v){S.rs=+v;R()},reviewOpen:function(v){S.rv=+v;S.rs=5;R()},
submitReview:function(){var o=oid(S.rv);run(function(){return SB.from('reviews').insert({order_id:o.id,fan_id:S.me.id,creator_id:o.creator_id,rating:S.rs,body:(el('rt').value||'').trim().slice(0,300)})},'Thanks for your review').then(function(){S.rv=0;R()})},
photo:function(f){if(f.size>5242880)return bad('Photo is over 5 MB');var p=S.me.id+'/'+Date.now()+'-'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');run(async function(){var u=await SB.storage.from('avatars').upload(p,f,{contentType:f.type});if(u.error)return u;var a=await SB.from('profiles').update({photo_path:p}).eq('id',S.me.id);if(a.error)return a;if(S.role=='creator')return SB.from('creators').update({photo_path:p}).eq('id',S.me.id)},'Photo updated')},
saveBio:function(){var sl=Math.round(+el('sl2').value)||null;run(function(){return SB.from('creators').update({category:el('cc2').value,niche:el('cn3').value,accepting:el('ac').value=='1',weekly_slots:sl,tagline:el('tg').value.trim(),bio:el('bo').value.trim()}).eq('id',S.me.id)},'Profile saved').then(sheetDone)},
fav:function(v){var on=S.favs.indexOf(v)>-1;run(function(){return on?SB.from('favourites').delete().eq('fan_id',S.me.id).eq('creator_id',v):SB.from('favourites').insert({fan_id:S.me.id,creator_id:v})})},
open:function(v){S.rec=[v].concat(S.rec.filter(function(x){return x!=v})).slice(0,8);try{localStorage.setItem('sw_rec',JSON.stringify(S.rec))}catch(e){}S.cur=v;pushH();S.note=getDraft(v);S.occ='';S.rc='';S.svc=0;S.promo=null;S.nb='';S.pcv='';R()},back:function(){goBack(function(){S.cur=0;R()})},
book:function(){var n=el('note').value.trim();if(!n)return bad('Add a short note for the creator');var c=S.cur;run(function(){return SB.from('orders').insert({fan_id:S.me.id,creator_id:c,service_id:(selSvc(cr(c))||{}).id||null,note:n,promo_code:S.promo?S.promo.code:null,needed_by:S.nb||null,recipient:(S.rc||'').trim()||null})},'Booked. Pay to confirm your order.').then(function(ok){if(ok){try{localStorage.removeItem('sw_d_'+c)}catch(e){}S.cur=0;S.tab='Orders';S.rc='';S.promo=null;S.nb='';S.pcv='';R()}})},
pay:function(v){S.pay=+v;R()},closePay:function(){S.pay=0;R()},
submitPay:function(){var c=el('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{10}$/.test(c))return bad('Enter the 10-character M-Pesa code');var id=S.pay;S.pay=0;run(function(){return SB.from('orders').update({mpesa_code:c,status:'verifying'}).eq('id',id)},'Code received. We are verifying your payment.')},
confirm:function(v){run(function(){return SB.from('orders').update({status:'paid'}).eq('id',v)},'Payment confirmed')},
reject:function(v){run(function(){return SB.from('orders').update({status:'rejected'}).eq('id',v)},'Payment rejected')},
deliver:function(v){if(!confirm('Before you upload:\n• Did you say their name?\n• Does it match their request?\n• Is the video clear?\n\nTap OK if yes.'))return;var f=el('f'+v).files[0];if(!f)return bad('Choose a video or audio file first');if(f.size>52428800)return bad('File is over 50 MB');var path=v+'/'+Date.now()+'-'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');
run(async function(){var u=await SB.storage.from('deliveries').upload(path,f,{contentType:f.type});if(u.error)return u;return SB.from('orders').update({video_path:path,status:'delivered'}).eq('id',v)},'Delivered')},
watch:async function(v){var o=oid(v);pushH();S.watch=+v;S.url='';R();var r=await SB.storage.from('deliveries').createSignedUrl(o.video_path,1800);if(r.error)return bad(r.error.message);S.url=r.data.signedUrl;R()},
closeWatch:function(){goBack(function(){S.watch=0;S.url='';R()})},
approve:function(v){run(function(){return SB.from('creators').update({approved:true}).eq('id',v)},'Creator approved')},
verify:function(v){var c=cr(v);run(function(){return SB.from('creators').update({verified:!c.verified}).eq('id',v)},'Updated')},
saveSet:function(){var c=+el('comm').value,f=+el('fee').value;if(!(c>=0&&c<=100&&f>=0))return bad('Enter valid numbers');run(function(){return SB.from('settings').upsert([{key:'commission',value:Math.round(c)},{key:'creator_fee',value:Math.round(f)}])},'Settings saved')},
becomeCreator:function(){var n=el('cn').value.trim(),p=Math.round(+el('cp').value);if(!n||!(p>0))return bad('Enter a name and a price');run(function(){return SB.rpc('become_creator',{p_name:n,p_category:el('cc').value,p_price:p})},'Application sent. An admin will approve you.')}};
